<!doctype html>
<meta charset="utf-8">
<title>Kobo Photo Frame</title>
<style>html,body{margin:0;height:100%;background:#111}body{display:flex;justify-content:center;align-items:center}img{max-height:100vh;max-width:100vw}</style>
<img id="f" alt="frame">
<script>
  // 加 cache-buster 繞過 Cloudflare 邊緣快取，並每 5 分鐘重抓最新圖
  function load() { document.getElementById('f').src = 'frame.png?t=' + Date.now(); }
  load();
  setInterval(load, 5 * 60 * 1000);
</script>
